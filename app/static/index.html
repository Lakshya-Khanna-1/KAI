<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>KAI — Personal AI Assistant</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0B0F19">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css?v=2">
</head>
<body>
  <div id="app" class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="logo">K</div>
        <div class="brand-text">
          <h1>KAI</h1>
          <span class="status-indicator online" id="status-dot">Online</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-start-onboarding" class="icon-btn-text" style="background: rgba(24, 144, 255, 0.15); color: #1890ff; border: 1px solid rgba(24, 144, 255, 0.3); border-radius: 20px; padding: 4px 12px; font-size: 0.82rem; font-weight: 500; display: flex; align-items: center; gap: 6px; cursor: pointer;" title="Start Onboarding Interview">🎙️ Interview Me</button>
        <button id="btn-theme-toggle" class="icon-btn" title="Toggle Theme">🌙</button>
      </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="app-nav">
      <button class="nav-btn active" data-view="chat">
        <span class="nav-icon">💬</span>
        <span class="nav-label">Chat</span>
      </button>
      <button class="nav-btn" data-view="tasks">
        <span class="nav-icon">📋</span>
        <span class="nav-label">Tasks</span>
      </button>
      <button class="nav-btn" data-view="reminders">
        <span class="nav-icon">⏰</span>
        <span class="nav-label">Reminders</span>
      </button>
      <button class="nav-btn" data-view="settings">
        <span class="nav-icon">⚙️</span>
        <span class="nav-label">Settings</span>
      </button>
    </nav>

    <!-- Main Content Area -->
    <main class="app-main">
      <!-- Chat View -->
      <section id="view-chat" class="view active">
        <div class="chat-messages" id="chat-messages">
          <div class="message assistant-msg welcome-card">
            <div class="msg-header">
              <span class="sender-name">KAI</span>
              <span class="msg-time">Now</span>
            </div>
            <div class="msg-content">
              Welcome back. I am connected and ready. What can I do for you today?
              <div style="margin-top: 10px;">
                <button id="btn-welcome-onboarding" class="btn-primary" style="width: auto; font-size: 0.85rem; padding: 6px 14px; background: linear-gradient(135deg, #1890ff, #722ed1); border: none;">🎙️ Start Onboarding Interview</button>
              </div>
            </div>
          </div>
        </div>

        <div class="chat-input-bar">
          <textarea id="chat-input" placeholder="Type a message or command..." rows="1"></textarea>
          <button id="btn-send" class="btn-primary">
            <span>Send</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          </button>
        </div>
      </section>

      <!-- Tasks View -->
      <section id="view-tasks" class="view">
        <div class="section-header">
          <h2>Tasks & Todo</h2>
          <button id="btn-refresh-tasks" class="icon-btn">🔄</button>
        </div>
        <div class="task-input-card">
          <input type="text" id="new-task-title" placeholder="Add a new task...">
          <button id="btn-add-task" class="btn-secondary">Add</button>
        </div>
        <div id="tasks-list" class="items-list">
          <div class="empty-state">Loading tasks...</div>
        </div>
      </section>

      <!-- Reminders View -->
      <section id="view-reminders" class="view">
        <div class="section-header">
          <h2>Reminders & Alarms</h2>
          <button id="btn-refresh-reminders" class="icon-btn">🔄</button>
        </div>
        <div id="reminders-list" class="items-list">
          <div class="empty-state">Loading reminders...</div>
        </div>
      </section>

      <!-- Settings View -->
      <section id="view-settings" class="view">
        <div class="section-header">
          <h2>Settings</h2>
        </div>
        <div class="settings-card">
          <div class="setting-item">
            <label>Profile & Onboarding</label>
            <div style="margin-top: 6px;">
              <button id="btn-settings-onboarding" class="btn-secondary" style="margin-bottom: 8px;">🎙️ Start / Re-run Onboarding Interview</button>
              <div id="user-profile-box" class="info-box" style="font-size: 0.85rem; max-height: 160px; overflow-y: auto;">
                Loading profile facts...
              </div>
            </div>
          </div>
          <div class="setting-item">
            <label for="api-token-input">API Token Auth</label>
            <div class="token-input-group">
              <input type="password" id="api-token-input" placeholder="Enter API Token (if set in .env)">
              <button id="btn-save-token" class="btn-secondary">Save Token</button>
            </div>
          </div>
          <div class="setting-item">
            <label>Push Notifications</label>
            <button id="btn-sub-push" class="btn-primary">Enable Web Push</button>
          </div>
          <div class="setting-item">
            <label>System Info</label>
            <div class="info-box" id="system-info-box">
              Loading system health...
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="/app.js?v=5"></script>
</body>
</html>
